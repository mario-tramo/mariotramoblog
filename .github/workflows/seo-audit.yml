name: SEO Audit

# Schedule: weekly (Sunday 06:00 UTC) + manual dispatch
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      apply_fixes:
        description: "Applica correzioni automatiche"
        type: boolean
        default: false
      commit_report:
        description: "Committa il report HTML"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.12.4 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SEO audit
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          NEXT_PUBLIC_SANITY_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_CONTACT_NAME: ${{ secrets.NEXT_PUBLIC_CONTACT_NAME }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ secrets.NEXT_PUBLIC_CONTACT_EMAIL }}
        run: |
          if [ "${{ github.event.inputs.apply_fixes }}" == "true" ]; then
            pnpm seo:audit:fix:apply --output docs/seo-audit-report.html
          else
            pnpm seo:audit --output docs/seo-audit-report.html
          fi

      - name: Commit report
        if: ${{ github.event.inputs.commit_report != 'false' }}
        continue-on-error: true
        run: |
          git config user.name "SEO Audit Bot"
          git config user.email "bot@trmsport.com"
          git add docs/seo-audit-report.html
          git diff --cached --quiet || (
            git commit -m "chore: aggiorna report SEO audit [skip ci]"
            git push
          )

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report
          path: docs/seo-audit-report.html
          if-no-files-found: error

      - name: Send report to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for chat_id in ${TELEGRAM_CHAT_IDS//,/ }; do
            if [ -z "$chat_id" ]; then continue; fi
            echo "Invio report a chat_id=${chat_id}"
            curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${chat_id}" \
              -F document=@docs/seo-audit-report.html \
              -F caption="🔍 SEO Audit completato — report in allegato. Dettagli: ${RUN_URL}"
          done