name: Sports data scrape

# Daily at 06:00 UTC. Fantasy data remains FBref-backed; standings use the
# resilient Wikipedia REST source because FBref blocks GitHub Actions runners.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  fantasy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fantasy scraper dependencies
        run: pip install --quiet soccerdata requests

      - name: Run daily FBref scrape (fantasy)
        env:
          FANTASY_WEBHOOK_URL: ${{ secrets.FANTASY_WEBHOOK_URL }}
          FANTASY_INGEST_SECRET: ${{ secrets.FANTASY_INGEST_SECRET }}
          FANTASY_LEAGUES: "Serie A"
        run: python scripts/fantasy_scrape.py

  standings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install standings scraper dependencies
        run: pip install --quiet requests beautifulsoup4 lxml

      - name: Run daily standings scrape (Wikipedia)
        env:
          STANDINGS_WEBHOOK_URL: ${{ secrets.STANDINGS_WEBHOOK_URL }}
          STANDINGS_INGEST_SECRET: ${{ secrets.STANDINGS_INGEST_SECRET }}
          STANDINGS_HEARTBEAT_URL: ${{ secrets.STANDINGS_WEBHOOK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python scripts/standings_scrape_wikipedia.py

      - name: Run standings scraper unit tests
        working-directory: scripts
        run: python -m unittest -v test_standings_scrape_wikipedia.py
