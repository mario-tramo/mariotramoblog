name: Sports data scrape

# Daily at 06:00 UTC. Fantasy data remains FBref-backed; standings use the
# unified scraper that prefers FBref and falls back to the resilient
# Wikipedia REST source when FBref blocks GitHub Actions runners.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      run_standings_tests:
        description: "Esegui anche i test dello scraper classifiche"
        type: boolean
        default: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  fantasy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install fantasy scraper dependencies
        run: pip install --quiet -r scripts/requirements.txt

      - name: Run daily FBref scrape (fantasy)
        env:
          FANTASY_WEBHOOK_URL: ${{ secrets.FANTASY_WEBHOOK_URL }}
          FANTASY_INGEST_SECRET: ${{ secrets.FANTASY_INGEST_SECRET }}
          FANTASY_LEAGUES: "Serie A"
        run: python scripts/fantasy_scrape.py

  standings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install standings scraper dependencies
        run: pip install --quiet -r scripts/requirements.txt

      - name: Run daily standings scrape (FBref + Wikipedia fallback)
        env:
          STANDINGS_WEBHOOK_URL: ${{ secrets.STANDINGS_WEBHOOK_URL }}
          STANDINGS_INGEST_SECRET: ${{ secrets.STANDINGS_INGEST_SECRET }}
          STANDINGS_HEARTBEAT_URL: ${{ secrets.STANDINGS_WEBHOOK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STANDINGS_ALLOW_PARTIAL: "true"
        run: python scripts/standings_scrape.py

      - name: Run standings scraper unit tests
        working-directory: scripts
        run: python -m unittest -v test_standings_scrape.py test_standings_scrape_wikipedia.py
